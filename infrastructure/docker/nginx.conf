server_tokens off;

# Swagger UI needs inline scripts; nothing else does.
map $uri $csp {
  default       "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
  ~^/api/docs   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 256k;

  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location = /health { proxy_pass http://api:3000; include /etc/nginx/conf.d/proxy.inc; }
  location /api/ { proxy_pass http://api:3000; include /etc/nginx/conf.d/proxy.inc; }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }
  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
